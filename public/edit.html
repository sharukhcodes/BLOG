<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blogbook - Edit blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html">Blogbook</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="add.html">Add blog</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Edit post</h1>
    <div id="message" class="message hidden"></div>

    <form id="edit-form" class="form-card" novalidate>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="150" required>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" maxlength="80" required>
      </div>
      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" required></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">Save changes</button>
        <a href="index.html" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
